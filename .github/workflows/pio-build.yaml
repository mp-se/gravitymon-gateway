name: PlatformIO CI

on: 
  workflow_dispatch:
  pull_request:
  push:
    branches: 
      - dev

jobs:
  pio-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup PlatformIO
        # intelhex is required by PlatformIO but missing from its dependencies
        run: pip install platformio intelhex

      - name: Build UI
        run: |
          cd ui
          npm install
          npm run build

      - name: Build gateway32pro-tft
        run: pio run -e gateway32pro-tft

      - name: Build gateway32s3pro-tft-sd
        run: pio run -e gateway32s3pro-tft-sd

      - name: Build gateway32s3wave-tft28-sd
        run: pio run -e gateway32s3wave-tft28-sd

      - name: Build gateway32s3wave-tft43-sd
        run: pio run -e gateway32s3wave-tft43-sd
    
      # Pull requests only verify that the build works, nothing is committed
      - uses: EndBug/add-and-commit@v11 # You can change this to use a specific version. https://github.com/marketplace/actions/add-commit
        if: ${{ github.event_name != 'pull_request' }}
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
