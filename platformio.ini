[env:gateway32s3wave-tft43-sd]
; Waveshare ESP32-S3-Touch-LCD-4.3 — 800x480 RGB parallel display, GT911 touch, CH422G expander
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform3}
extra_scripts =
	${common_env_data.extra_scripts}
	pre:script/patch_i2c_libdriver.py
build_unflags = ${common_env_data.build_unflags}
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_LCD_RGB_RESTART_IN_VSYNC=1   ; Forces DMA to auto-align on desyncs
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LOG_LEVEL=5
	-D ESP32S3=1
	-D ENABLE_TFT=1
	-D ESPFWK_DISABLE_LED=1
	; SD card via SPI — real CS is on CH422G EXIO4 (held LOW permanently).
	; SD_CS=6 is an unused GPIO: the SD library toggles it harmlessly while
	; CH422G EXIO4 stays LOW as the actual hardware CS.
	; GPIO47 must NOT be used here — it is wired to the RGB display data bus (G4).
	-D ENABLE_SD=1
	-D SD_SCK=12
	-D SD_MISO=13
	-D SD_MOSI=11
	-D SD_CS=6
	-D SD_EXPANDER_CS=4
	; Display dimensions (RGB panel — no SPI TFT defines needed)
	-D TFT_WIDTH=800
	-D TFT_HEIGHT=480
	-D TOUCH_CS=-1
	; Expose src/ so ESP32_Display_Panel can find esp_panel_board_custom_conf.h
	; via __has_include() during library compilation (include_dir = lib, not src)
	-I ${PROJECT_DIR}/src
	; patch_i2c_libdriver.py (pre-build) zeros the .ctors section header of
	; i2c.c.obj inside a local copy of libdriver.a, so check_i2c_driver_conflict
	; is never registered as a constructor and the abort() at boot never fires.
lib_deps =
	${common_env_data.lib_deps}
	${common_env_data.lib_deps_esp_panel}
lib_ignore =
	mpu6050
	ch422g
	gt911
board = waveshare_s3_tft43
board_build.variants_dir = boards
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}
