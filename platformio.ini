; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = lib
include_dir = lib

[common_env_data]
; upload_speed = 921600
upload_speed = 460800
monitor_speed =  115200
platform = espressif8266@4.2.1
platform32 = espressif32@6.11.0
build_unflags = 
build_flags = 
	-Wl,-Map,output.map
	-D BAUD=${common_env_data.monitor_speed}
	-D USE_LITTLEFS=true
	-D GATEWAY=1
	-D CFG_APPNAME="\"gravitymon-gw\""
	-D CFG_APPVER="\"0.8.0\""
	-D CFG_GITREV=\""beta-2\""
	; !python script/git_rev.py 
	-D MAX_SKETCH_SPACE=0x640000
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000   ; (keep default)
	-D CONFIG_ASYNC_TCP_PRIORITY=10         ; (keep default)
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64       ; (keep default)
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1      ; force async_tcp task to be on same core as Arduino app (default is any core)
	-D CONFIG_ASYNC_TCP_STACK_SIZE=12288    ; reduce the stack size (default is 16K)
build_flags_lvgl = 
	-D LV_CONF_SKIP=1
	-D LV_USE_LOG=1
	-D LV_USE_TFT_ESPI=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_MEM_SIZE=32*1024
	-D LV_USE_GESTURE=1
	-D ENABLE_LVGL=1
lib_deps_tft =
	https://github.com/Bodmer/TFT_eSPI#V2.5.43
	https://github.com/lvgl/lvgl#v9.3.0
	SPI
lib_deps =
	https://github.com/mp-se/espframework#1.1.10
	https://github.com/mp-se/gravitymon#2.3.0-beta1
    https://github.com/bblanchon/ArduinoJson#v7.4.2
    https://github.com/256dpi/arduino-mqtt#v2.5.2
	https://github.com/ESP32Async/ESPAsyncWebServer#v3.7.10
	https://github.com/pstolarz/OneWireNg#0.14.0
    https://github.com/pstolarz/Arduino-Temperature-Control-Library.git#d2d70ab
lib_deps8266 = 
	https://github.com/esphome/ESPAsyncTCP#v2.0.0
lib_deps32 = 
	https://github.com/ESP32Async/AsyncTCP#v3.4.7
lib_deps_ble32 = 
	https://github.com/h2zero/NimBLE-Arduino#2.3.3
extra_scripts =  
	pre:script/board.py 
	script/copy_firmware.py
	script/create_versionjson.py
html_files = 
	html/index.html
	html/app.js.gz
	html/app.css.gz
	html/favicon.ico.gz

[env:gateway-unit]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	-D LOG_LEVEL=5
	-D PIN_VOLT=10
lib_deps = 
	https://github.com/bxparks/AUnit#v1.7.1
	${common_env_data.lib_deps}
	${common_env_data.lib_deps8266}
	ESP8266httpUpdate
	DNSServer
board = d1_mini
build_type = release
board_build.filesystem = littlefs
build_src_filter = +<*> -<main*.cpp> +<../test/tests*.cpp> -<ble_*.cpp> -<web_*.cpp> -<push_*.cpp> -<display.cpp>
monitor_filters = esp8266_exception_decoder

[env:gateway32pro-tft]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform32}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LOG_LEVEL=4
	-D ESP32=1
	-D ENABLE_BLE=1
	-D ENABLE_TFT=1
	; -D ENABLE_TILT_SCANNING
	; Defines for TFT driver
	-D LCD_TFT=1
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D CGRAM_OFFSET=1
	-D TFT_BL=32
	-D TFT_BACKLIGHT_ON=1
	-D LOAD_GFXFF=1
	-D TOUCH_CS=12	
lib_deps = 
	${common_env_data.lib_deps}
	${common_env_data.lib_deps32}
	${common_env_data.lib_deps_tft}
	${common_env_data.lib_deps_ble32}
lib_ignore = 
	mpu6050
board = lolin_d32_pro
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}
board_upload.maximum_size = 16777216
board_upload.flash_size = 16MB

[env:gateway32s3pro-tft-sd]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform32}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LOG_LEVEL=4
	-D ESP32S3=1
	-D ENABLE_BLE=1
	-D ENABLE_TFT=1
	; Defines for SD card driver
	-D ENABLE_SD=1 
	-D SD_CS=46
	; Defines for TFT driver
	-D LCD_TFT=1
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D ILI9341_DRIVER=1 
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D CGRAM_OFFSET=1
	-D SMOOTH_FONT=1
	-D TFT_BACKLIGHT_ON=1
	-D LOAD_GFXFF=1
	-D TOUCH_CS=45
	-D TFT_BL=14
	-D TFT_DC=47
	-D TFT_MISO=13
	-D TFT_MOSI=11
	-D TFT_SCLK=12
	-D TFT_RST=21
	-D TFT_CS=48
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=60000000
lib_deps = 
	${common_env_data.lib_deps}
	${common_env_data.lib_deps32}
	${common_env_data.lib_deps_tft}
	${common_env_data.lib_deps_ble32}
lib_ignore = 
	mpu6050
board = lolin_s3_pro
board_build.variants_dir = boards
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gateway32s3wave-tft-sd]
; Wavewhare esp32s3 with 2.8" TFT
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform32}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LOG_LEVEL=5
	; -D CORE_DEBUG_LEVEL=5
	-D ESP32S3=1
	-D ENABLE_BLE=1
	-D ENABLE_TFT=1
	; -D ENABLE_TILT_SCANNING
	; Defines for SD card driver
	-D ENABLE_MMC=1
	-D MMC_CLK=14
	-D MMC_CMD=17
	-D MMC_D0=16
	; Defines for TFT driver
	-D LCD_TFT=1
	-D USER_SETUP_LOADED=1
	-D USE_HSPI_PORT=1
	-D ST7789_DRIVER=1 
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D CGRAM_OFFSET=1
	-D SMOOTH_FONT=1
	-D LOAD_GFXFF=1
	-D TOUCH_CS=-1
	-D TFT_BL=5
	-D TFT_BACKLIGHT_ON=1
	-D TFT_DC=41
	-D TFT_MISO=-1
	-D TFT_MOSI=45
	-D TFT_SCLK=40
	-D TFT_RST=39
	-D TFT_CS=42
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=60000000
lib_deps = 
	${common_env_data.lib_deps}
	${common_env_data.lib_deps32}
	${common_env_data.lib_deps_tft}
	${common_env_data.lib_deps_ble32}
	; SD
board = waveshare_s3_tft
board_build.variants_dir = boards
build_type = release
board_build.filesystem = littlefs
board_build.partitions = part32_16mb_coredump.csv
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

