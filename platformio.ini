; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
lib_dir = lib
include_dir = lib

[common_env_data]
; upload_speed = 921600
upload_speed = 460800
monitor_speed =  115200
; ESP32 - Arduino 2.x
platform2 = espressif32@6.11.0 # Arduino 2.x
; ESP32 - Arduino 3.x
; platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
; platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
; platform3 = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip # Arduino 3.x
build_unflags = 
build_flags = 
	-Wl,-Map,output.map
	-D BAUD=${common_env_data.monitor_speed}
	-D USE_LITTLEFS=true
	-D GATEWAY=1
	-D CFG_APPNAME="\"gravitymon-gw\""
	-D CFG_APPVER="\"0.9.0\""
	; -D CFG_GITREV=\""dev-1\""
	!python script/git_rev.py
	-D MAX_SKETCH_SPACE=0x640000
	-D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000   ; (keep default)
	-D CONFIG_ASYNC_TCP_PRIORITY=10         ; (keep default)
	-D CONFIG_ASYNC_TCP_QUEUE_SIZE=64       ; (keep default)
	-D CONFIG_ASYNC_TCP_RUNNING_CORE=1      ; force async_tcp task to be on same core as Arduino app (default is any core)
	-D CONFIG_ASYNC_TCP_STACK_SIZE=12288    ; reduce the stack size (default is 16K)
	; -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	; -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=30
build_flags_lvgl =
	-D LV_CONF_SKIP=1
	-D LV_USE_LOG=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_CONF_INCLUDE_SIMPLE=1
	-D LV_MEM_SIZE=32*1024
	-D LV_USE_GESTURE=1
	-D ENABLE_LVGL=1
lib_deps_espi =
	https://github.com/Bodmer/TFT_eSPI#V2.5.43
	https://github.com/lvgl/lvgl#v9.4.0
	SPI
lib_deps_lovyan =
	https://github.com/lovyan03/LovyanGFX#develop
	https://github.com/lvgl/lvgl#v9.4.0
lib_deps_esp_panel =
	https://github.com/esp-arduino-libs/ESP32_Display_Panel#v1.0.4
	https://github.com/esp-arduino-libs/esp-lib-utils#v0.3.0
	; ESP32_IO_Expander is kept as a local copy in lib/ESP32_IO_Expander — see PATCHES.md
	https://github.com/lvgl/lvgl#v9.4.0
lib_deps =
	https://github.com/mp-se/espframework#1.2.12
	https://github.com/mp-se/gravitymon#v2.4.0-dev1
    https://github.com/bblanchon/ArduinoJson#v7.4.2
    https://github.com/256dpi/arduino-mqtt#v2.5.2
	https://github.com/ESP32Async/ESPAsyncWebServer#v3.9.3
	https://github.com/pstolarz/OneWireNg#0.14.1
    https://github.com/pstolarz/Arduino-Temperature-Control-Library.git#d2d70abe03299650b860e8ef74d7322d3f305cad
	https://github.com/h2zero/NimBLE-Arduino#2.3.7
	https://github.com/ESP32Async/AsyncTCP#v3.4.9
extra_scripts =  
	pre:script/board.py 
	script/copy_firmware.py
	script/create_versionjson.py
html_files = 
	html/index.html
	html/app.js.gz
	html/app.css.gz
	html/favicon.ico.gz

[env:gateway32-unit]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform2}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	-D LOG_LEVEL=5
	-D PIN_VOLT=10
	-D ESP32C3=1
	-D GATEWAY=1
	-D CFG_FILENAMEBIN="\"firmware-unit.bin\""
	-D ESPFWK_DISABLE_WEBSERVER=1
	-D ESPFWK_DISABLE_WIFI=1
lib_deps = 
	https://github.com/bxparks/AUnit#v1.7.1
	${common_env_data.lib_deps}
lib_ignore =
	WiFi
	ESPAsyncWebServer
	ESP32_IO_Expander
	AsyncTCP
	ESPmDNS
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	DNSServer
board = lolin_c3_mini
build_type = release
board_build.filesystem = littlefs
build_src_filter = +<*> -<main_gateway.cpp> +<../test/tests*.cpp> -<web_gateway.cpp> -<push_gateway.cpp>
monitor_filters = esp32_exception_decoder
board_build.embed_txtfiles = ${common_env_data.html_files}

[env:gateway32pro-tft]
upload_speed = ${common_env_data.upload_speed}
monitor_speed = ${common_env_data.monitor_speed}
framework = arduino
platform = ${common_env_data.platform2}
extra_scripts = ${common_env_data.extra_scripts}
build_unflags = ${common_env_data.build_unflags}
build_flags = 
	${common_env_data.build_flags}
	${common_env_data.build_flags_lvgl}
	-D LV_USE_TFT_ESPI=1
	-D LOG_LEVEL=4
	-D ESP32=1
	-D ENABLE_TFT=1
